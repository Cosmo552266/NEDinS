# Pipeline configuration. Override via env vars (NEDINS_*) or CLI flags.

pipeline:
  locales:
    primary: zh-Hant
    secondary: en
  regions: [HK, TW, US]
  campaign_cadence_days: 3   # 幾耐出一個 campaign

trend_scout:
  topics:
    - 懸疑
    - 都市傳說
    - 節日鬼故
    - 心理驚悚
  holiday_lookahead_days: 30
  pytrends_keywords_en: ["ghost story", "urban legend", "haunted", "creepy"]
  pytrends_keywords_zh: ["鬼故事", "都市傳說", "靈異", "怪談"]

story_writer:
  target_word_count_zh: 2200
  target_word_count_en: 1800
  tone: "成人 / 懸疑 / 心理 / 開放式結尾"
  key_visual_count: 4
  gemini_model: "gemini-2.5-pro"
  safety_block_threshold: "BLOCK_ONLY_HIGH"  # 為成人主題放寬

storyboard:
  scenes_min: 8
  scenes_max: 12
  gemini_model: "gemini-2.5-pro"

image_generator:
  imagen_model: "imagen-3.0-generate-002"
  style: "dark cinematic, film grain, muted teal-and-orange palette, 35mm lens"
  cover_aspect: "16:9"
  scene_aspect: "16:9"
  pod_aspect: "1:1"
  pod_resolution: [4500, 5400]

voiceover:
  tts_model: "gemini-tts"
  voice_zh: "zh-HK-Standard-D"   # placeholder; verify in Chirp catalog
  voice_en: "en-US-Studio-O"

video_composer:
  resolution: [1920, 1080]
  fps: 30
  ken_burns: true
  subtitle_font: "Noto Sans CJK TC"
  bgm: null

marketing:
  platforms: [instagram, x, tiktok, facebook]
  hashtag_count: 8

pod_publisher:
  blueprints:
    - { name: "T-shirt", blueprint_id: 6,   print_provider_id: 1 }
    - { name: "Poster",  blueprint_id: 282, print_provider_id: 1 }
    - { name: "Mug",     blueprint_id: 9,   print_provider_id: 1 }
  publish: false   # M3 開始改 true

youtube_publisher:
  privacy_status: "unlisted"   # 初期保守，M4 之後改 public
  category_id: "24"            # Entertainment
  default_language: "zh-Hant"
