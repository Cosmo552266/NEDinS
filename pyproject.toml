[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nedins"
version = "0.0.1"
description = "AI agent pipeline: Google Trends -> story -> video/images -> YouTube + Printify POD"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NEDinS" }]
dependencies = [
    "google-genai>=0.3.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pytrends>=4.9",
    "holidays>=0.50",
    "httpx>=0.27",
    "tenacity>=8.2",
    "moviepy>=1.0.3",
    "Pillow>=10.2",
    "python-slugify>=8.0",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.120",
    "duckdb>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
nedins = "nedins.orchestrator:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nedins"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
